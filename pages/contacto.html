<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Ruta correcta del CSS (saliendo de la carpeta pages) -->
    <link rel="stylesheet" href="../css/style.css" />

    <title>MemoryPlay - Contacto</title>

    <!-- Ruta correcta del Favicon (saliendo de la carpeta pages) y tipo de imagen -->
    <link rel="icon" type="image/png" href="../img/Logo color unico.png" />
  </head>
  <body>
    <header>
      <div class="div-logo">
        <!-- Ruta correcta para volver al inicio -->
        <a class="logo" href="../index.html">
          <img src="../img/Logo color unico.png" alt="Logo MemoryPlay" />
        </a>
      </div>
      <nav class="header-nav">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <!-- Como ya estamos en la carpeta pages, solo ponemos el nombre del archivo -->
          <li><a href="contacto.html">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="contacto">
        <h1 class="titulo-contacto text-secondary">Contactanos</h1>
        <form
          class="form-contacto"
          action="https://formspree.io/f/xkjoobon"
          method="POST"
        >
          <div class="grupo-input">
            <label for="email">Tu email:</label>
            <input id="email" type="email" name="email" required />
          </div>

          <div class="grupo-input">
            <label for="mensaje">Tu mensaje:</label>
            <textarea id="mensaje" name="message" required></textarea>
          </div>
          <button class="btn bg-secondary text-dark" type="submit">
            Enviar
          </button>
        </form>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 MemoryPlay. Proyecto TalentoTech.</p>
      <nav>
        <ul class="footer-nav">
          <li>
            <a href="#">
              <img src="../img/whatsapp.png" alt="Logo WhatsApp" />
            </a>
          </li>
          <li>
            <a href="#">
              <img src="../img/Instagram.png" alt="Logo Instagram" />
            </a>
          </li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
